<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src = "java.js" defer></script> 
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div>
        <H1 class="header1">ROCK PAPER SCISSORS</H1>
        <h2 class="header2">make your choice</h2>
    </div>

    <div class="player_info">
        <div class="player_track">
            <p class="player_name">[player's name]</p>
            <div class="scores">
                <p id="h_score">😃 score:</p>
                <p id="pc_score">👾 score:</p>
            </div>
        </div>
    </div>
    
    <div class="player_buttons">
        <button class="button" id="rock">🪨</button>
        <button class="button" id="paper">📄</button>
        <button class="button" id="scissors">✂️</button>
    </div>

</body>
